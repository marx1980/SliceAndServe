<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes"
    />
    <meta name="theme-color" content="#fff4dd" />
    <title>Slice &amp; Serve</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Slice &amp; Serve" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <button id="btn-menu" class="btn" type="button"></button>
        <div id="hud-info">
          <div id="level-title"></div>
          <div id="hud-values">
            <span id="v-moves"></span>
            <span id="v-target"></span>
            <span id="v-score"></span>
            <span id="v-goal"></span>
          </div>
        </div>
        <button id="btn-timeline" class="btn icon" type="button">
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
        </button>
        <button id="btn-settings" class="btn icon" type="button">
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="8" cy="17" r="2" />
          </svg>
        </button>
      </header>
      <ul id="orders"></ul>
      <div id="queue" hidden></div>
      <main id="stage" tabindex="0"></main>
      <section id="tools" hidden></section>
      <section id="coach" hidden></section>
      <section id="lesson" hidden>
        <span id="lesson-step"></span>
        <span id="lesson-prompt"></span>
        <button id="lesson-exit" class="btn" type="button"></button>
      </section>
      <footer id="actions">
        <button id="btn-undo" class="btn" type="button"></button>
        <button id="btn-hint" class="btn" type="button"></button>
        <button id="btn-place" class="btn primary" type="button" disabled></button>
        <button id="btn-restart" class="btn" type="button"></button>
      </footer>
      <div id="sr-status" class="sr-only" aria-live="polite"></div>

      <section id="menu" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="menu-title"></h2>
          <div id="level-grid"></div>
          <div class="button-row">
            <button id="menu-tutorial" class="btn" type="button"></button>
            <button id="menu-modes" class="btn" type="button"></button>
            <button id="menu-recipes" class="btn" type="button"></button>
            <button id="menu-bakery" class="btn" type="button"></button>
            <button id="menu-fair" class="btn" type="button"></button>
            <button id="menu-close" class="btn" type="button"></button>
          </div>
        </div>
      </section>

      <section id="settings" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="settings-title"></h2>
          <div id="settings-body"></div>
          <button id="settings-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="timeline" class="overlay sheet" hidden role="dialog" aria-label="Timeline">
        <div class="panel">
          <div class="timeline-head">
            <h2 id="timeline-title"></h2>
            <span id="timeline-pos"></span>
          </div>
          <input id="timeline-range" type="range" min="0" max="0" value="0" />
          <div class="button-row">
            <button id="tl-undo" class="btn" type="button"></button>
            <button id="tl-redo" class="btn" type="button"></button>
            <button id="tl-bookmark" class="btn" type="button" aria-pressed="false"></button>
            <button id="tl-replay" class="btn" type="button"></button>
          </div>
          <div id="tl-bookmarks" class="chips"></div>
          <div id="tl-branches" class="chips"></div>
          <button id="timeline-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="fairbake" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="fair-title"></h2>
          <dl id="fair-rows" class="rows"></dl>
          <button id="fair-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="tutorials" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="tutorials-title"></h2>
          <div id="tutorials-body" class="chips"></div>
          <button id="tutorials-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="modes" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="modes-title"></h2>
          <div id="modes-body"></div>
          <button id="modes-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="recipes" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="recipes-title"></h2>
          <div id="recipes-body"></div>
          <button id="recipes-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="bakery" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="bakery-title"></h2>
          <div id="bakery-body"></div>
          <button id="bakery-close" class="btn" type="button"></button>
        </div>
      </section>

      <section id="story" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="story-speaker"></h2>
          <p id="story-text"></p>
          <div class="button-row">
            <button id="story-skip" class="btn" type="button"></button>
            <button id="story-next" class="btn primary" type="button"></button>
          </div>
        </div>
      </section>

      <section id="ending" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="ending-title"></h2>
          <dl id="ending-rows" class="rows"></dl>
          <p id="ending-credits"></p>
          <button id="ending-close" class="btn primary" type="button"></button>
        </div>
      </section>

      <section id="result" class="overlay" hidden role="dialog" aria-modal="true">
        <div class="panel">
          <h2 id="result-title"></h2>
          <div id="result-values"></div>
          <dl id="result-analysis" class="rows"></dl>
          <div id="result-actions"></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
